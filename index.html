<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Travel Planner</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#111827" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 14px 18px;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .back-btn {
      width: auto;
      padding: 8px 12px;
      background: #374151;
      display: none;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    .home {
      padding: 18px;
      max-width: 720px;
      margin: 0 auto;
    }

    .home-title {
      font-size: 26px;
      font-weight: bold;
      margin: 10px 0 6px;
    }

    .home-sub {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .new-trip-btn {
      width: 100%;
      padding: 18px;
      font-size: 18px;
      border-radius: 16px;
      background: #111827;
      margin-bottom: 20px;
    }

    .trip-card {
      position: relative;
      background: white;
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08);
      cursor: pointer;
      border-left: 7px solid #2563eb;
    }

    .trip-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .trip-card h3 {
      margin: 0 0 6px;
      font-size: 18px;
    }

    .trip-menu-btn {
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: 50%;
      background: #e5e7eb;
      color: #111827;
      font-size: 22px;
      line-height: 1;
    }

    .trip-menu {
      display: none;
      position: absolute;
      top: 52px;
      right: 14px;
      width: 130px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      z-index: 50;
      overflow: hidden;
    }

    .trip-menu.active {
      display: block;
    }

    .trip-menu button {
      margin: 0;
      border-radius: 0;
      background: white;
      color: #111827;
      text-align: left;
      padding: 12px;
      font-size: 14px;
    }

    .trip-menu button:hover {
      background: #f3f4f6;
    }

    .trip-menu .delete-option {
      color: #dc2626;
    }

    .small {
      font-size: 13px;
      color: #555;
      line-height: 1.5;
    }

    .trip-card .small {
      color: #6b7280;
    }

    .empty {
      text-align: center;
      padding: 40px 10px;
      color: #6b7280;
      background: white;
      border-radius: 16px;
    }

    .app-layout {
      display: flex;
      height: calc(100vh - 56px);
    }

    .sidebar {
      width: 42%;
      min-width: 390px;
      padding: 14px;
      overflow-y: auto;
      background: #f9fafb;
      border-right: 1px solid #ddd;
    }

    #map {
      width: 58%;
      height: 100%;
    }

    h2 {
      margin: 14px 0 8px;
      font-size: 17px;
    }

    input, select, button, textarea {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
      min-height: 60px;
    }

    button {
      border: none;
      background: #111827;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { opacity: 0.9; }

    .row {
      display: flex;
      gap: 8px;
    }

    .row > * { flex: 1; }

    .sub-btn { background: #374151; }
    .search-btn { background: #2563eb; }
    .danger { background: #dc2626; }
    .route { background: #16a34a; }

    .trip-info {
      background: #e5e7eb;
      padding: 10px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
    }

    .summary {
      background: #e5e7eb;
      padding: 10px;
      border-radius: 10px;
      font-size: 14px;
      margin: 10px 0;
      line-height: 1.6;
    }

    .place-card {
      background: white;
      padding: 12px;
      margin: 10px 0;
      border-radius: 12px;
      border-left: 7px solid #999;
      box-shadow: 0 1px 5px rgba(0,0,0,0.08);
    }

    .place-card h3 {
      margin: 0 0 6px;
      font-size: 16px;
    }

    .badge {
      display: inline-block;
      padding: 3px 7px;
      border-radius: 999px;
      background: #e5e7eb;
      font-size: 12px;
      margin-top: 4px;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 8px;
    }

    .icon-btn,
    .route,
    .danger {
      font-size: 20px;
      padding: 8px;
      min-height: 42px;
    }

    .icon-btn {
      background: #e5e7eb;
      color: #111827;
    }

    .active-like {
      background: #2563eb !important;
      color: white !important;
    }

    .active-dislike {
      background: #ef4444 !important;
      color: white !important;
    }

    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .modal-bg.active {
      display: flex;
    }

    .modal {
      background: white;
      border-radius: 16px;
      padding: 18px;
      width: 100%;
      max-width: 420px;
    }

    .modal h2 {
      margin-top: 0;
    }

    @media (max-width: 850px) {
      .app-layout {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        min-width: unset;
        height: 54%;
      }

      #map {
        width: 100%;
        height: 46%;
      }
    }
  </style>
</head>

<body>
  <header>
    <span id="headerTitle">Travel Planner</span>
    <button id="backBtn" class="back-btn" onclick="goHome()">홈</button>
  </header>

  <section id="homeScreen" class="screen active">
    <div class="home">
      <div class="home-title">내 여행 계획</div>
      <div class="home-sub">여행 폴더를 만들고, 날짜별 장소를 정리해보자.</div>

      <button class="new-trip-btn" onclick="openNewTripModal()">+ New Trip</button>

      <h2>여행 계획 / 폴더</h2>
      <div id="tripList"></div>
    </div>
  </section>

  <section id="detailScreen" class="screen">
    <div class="app-layout">
      <div class="sidebar">
        <div class="trip-info" id="currentTripInfo"></div>

        <h2>장소 검색</h2>
        <div class="row">
          <input type="text" id="searchKeyword" placeholder="예: 난바 장어 맛집" />
          <button class="search-btn" onclick="searchPlace()">검색</button>
        </div>

        <div class="small">검색하면 위도·경도가 자동 입력돼. 안 되면 지도 클릭 또는 직접 입력하면 돼.</div>

        <h2>장소 추가</h2>

        <input type="text" id="placeName" placeholder="장소 이름" />

        <select id="category">
          <option value="food">맛집</option>
          <option value="cafe">카페</option>
          <option value="tour">관광지</option>
          <option value="shopping">쇼핑</option>
          <option value="hotel">숙소</option>
          <option value="transport">교통</option>
          <option value="etc">기타</option>
        </select>

        <input type="date" id="date" />

        <div class="row">
          <input list="hourList" id="hour" placeholder="시" />
          <input list="minuteList" id="minute" placeholder="분" />
        </div>

        <datalist id="hourList"></datalist>
        <datalist id="minuteList"></datalist>

        <div class="row">
          <input type="number" step="any" id="lat" placeholder="위도" />
          <input type="number" step="any" id="lng" placeholder="경도" />
        </div>

        <input type="number" id="cost" placeholder="예상 경비 / 엔화" />
        <textarea id="memo" placeholder="메모: 예약 시간, 메뉴, 입장료 등"></textarea>

        <button onclick="addPlace()">장소 추가</button>

        <h2>일정 조회</h2>

        <input type="date" id="filterDate" onchange="renderPlaces()" />

        <select id="filterCategory" onchange="renderPlaces()">
          <option value="all">전체 카테고리</option>
          <option value="food">맛집</option>
          <option value="cafe">카페</option>
          <option value="tour">관광지</option>
          <option value="shopping">쇼핑</option>
          <option value="hotel">숙소</option>
          <option value="transport">교통</option>
          <option value="etc">기타</option>
        </select>

        <div class="summary" id="summaryBox"></div>

        <div class="row">
          <button class="sub-btn" onclick="exportData()">백업 저장</button>
          <button class="sub-btn" onclick="document.getElementById('importFile').click()">백업 불러오기</button>
        </div>

        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)" />

        <div id="placeList"></div>
      </div>

      <div id="map"></div>
    </div>
  </section>

  <div id="newTripModal" class="modal-bg">
    <div class="modal">
      <h2>새 여행 만들기</h2>

      <input type="text" id="tripName" placeholder="계획 이름 예: 오사카 여행" />

      <div class="row">
        <input type="date" id="tripStartDate" />
        <input type="date" id="tripEndDate" />
      </div>

      <button onclick="addTrip()">만들기</button>
      <button class="sub-btn" onclick="closeNewTripModal()">취소</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
