<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>여행 플래너 지도 앱 v3</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#111827" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 14px 18px;
      font-size: 20px;
      font-weight: bold;
    }

    .container {
      display: flex;
      height: calc(100vh - 56px);
    }

    .sidebar {
      width: 42%;
      min-width: 390px;
      padding: 14px;
      overflow-y: auto;
      background: #f9fafb;
      border-right: 1px solid #ddd;
    }

    #map {
      width: 58%;
      height: 100%;
    }

    h2 {
      margin: 14px 0 8px;
      font-size: 17px;
    }

    input, select, button, textarea {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
      min-height: 60px;
    }

    button {
      border: none;
      background: #111827;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { opacity: 0.9; }

    .row {
      display: flex;
      gap: 8px;
    }

    .row > * { flex: 1; }

    .sub-btn { background: #374151; }
    .search-btn { background: #2563eb; }
    .danger { background: #dc2626; }
    .route { background: #16a34a; }

    .trip-box {
      background: #e5e7eb;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 14px;
      line-height: 1.5;
    }

    .summary {
      background: #e5e7eb;
      padding: 10px;
      border-radius: 10px;
      font-size: 14px;
      margin: 10px 0;
      line-height: 1.6;
    }

    .place-card {
      background: white;
      padding: 12px;
      margin: 10px 0;
      border-radius: 12px;
      border-left: 7px solid #999;
      box-shadow: 0 1px 5px rgba(0,0,0,0.08);
    }

    .place-card h3 {
      margin: 0 0 6px;
      font-size: 16px;
    }

    .small {
      font-size: 13px;
      color: #555;
      line-height: 1.5;
    }

    .badge {
      display: inline-block;
      padding: 3px 7px;
      border-radius: 999px;
      background: #e5e7eb;
      font-size: 12px;
      margin-top: 4px;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 8px;
    }

    .icon-btn,
    .route,
    .danger {
      font-size: 20px;
      padding: 8px;
      min-height: 42px;
    }

    .icon-btn {
      background: #e5e7eb;
      color: #111827;
      transition: all 0.2s ease;
    }

    .active-like {
      background: #2563eb !important;
      color: white !important;
    }

    .active-dislike {
      background: #ef4444 !important;
      color: white !important;
    }

    hr {
      border: none;
      border-top: 1px solid #ddd;
      margin: 16px 0;
    }

    @media (max-width: 850px) {
      .container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        min-width: unset;
        height: 54%;
      }

      #map {
        width: 100%;
        height: 46%;
      }
    }
  </style>
</head>

<body>
  <header>여행 플래너 지도 앱 v3</header>

  <div class="container">
    <div class="sidebar">

      <h2>여행 계획 / 폴더</h2>

      <select id="tripSelect" onchange="changeTrip()"></select>

      <div class="trip-box" id="tripInfo">
        선택된 여행 계획이 없습니다.
      </div>

      <input type="text" id="tripName" placeholder="계획 이름 예: 오사카 여행" />

      <div class="row">
        <input type="date" id="tripStartDate" />
        <input type="date" id="tripEndDate" />
      </div>

      <div class="row">
        <button onclick="addTrip()">계획 추가</button>
        <button class="danger" onclick="deleteTrip()">계획 삭제</button>
      </div>

      <hr />

      <h2>장소 검색</h2>

      <div class="row">
        <input type="text" id="searchKeyword" placeholder="예: 난바 장어 맛집" />
        <button class="search-btn" onclick="searchPlace()">검색</button>
      </div>

      <div class="small">검색하면 위도·경도가 자동 입력돼. 안 되면 직접 입력하면 돼.</div>

      <h2>장소 추가</h2>

      <input type="text" id="placeName" placeholder="장소 이름" />

      <select id="category">
        <option value="food">맛집</option>
        <option value="cafe">카페</option>
        <option value="tour">관광지</option>
        <option value="shopping">쇼핑</option>
        <option value="hotel">숙소</option>
        <option value="transport">교통</option>
        <option value="etc">기타</option>
      </select>

      <input type="date" id="date" />

      <div class="row">
        <input list="hourList" id="hour" placeholder="시" />
        <input list="minuteList" id="minute" placeholder="분" />
      </div>

      <datalist id="hourList"></datalist>
      <datalist id="minuteList"></datalist>

      <div class="row">
        <input type="number" step="any" id="lat" placeholder="위도" />
        <input type="number" step="any" id="lng" placeholder="경도" />
      </div>

      <input type="number" id="cost" placeholder="예상 경비 / 엔화" />

      <textarea id="memo" placeholder="메모: 예약 시간, 메뉴, 입장료 등"></textarea>

      <button onclick="addPlace()">장소 추가</button>

      <hr />

      <h2>일정 조회</h2>

      <input type="date" id="filterDate" onchange="renderPlaces()" />

      <select id="filterCategory" onchange="renderPlaces()">
        <option value="all">전체 카테고리</option>
        <option value="food">맛집</option>
        <option value="cafe">카페</option>
        <option value="tour">관광지</option>
        <option value="shopping">쇼핑</option>
        <option value="hotel">숙소</option>
        <option value="transport">교통</option>
        <option value="etc">기타</option>
      </select>

      <div class="summary" id="summaryBox"></div>

      <div class="row">
        <button class="sub-btn" onclick="exportData()">백업 저장</button>
        <button class="sub-btn" onclick="document.getElementById('importFile').click()">백업 불러오기</button>
      </div>

      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)" />

      <div id="placeList"></div>
    </div>

    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
